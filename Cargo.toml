[package]
name = "orinium_text"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
unicode-bidi = "0.3"
unicode-linebreak = "0.1"

fontdb = "0.23"
fontdue = "0.9"
lru = "0.18"
rustybuzz = "0.20"
sys-locale = "0.3"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig = { version = "0.11", features = ["dlopen"] }

[target.'cfg(target_os = "windows")'.dependencies]
dwrote = "0.11"
winapi = { version = "0.3", features = ["dwrite"] }

[dev-dependencies]
env_logger = "0.11"

[features]
default = ["render"]
layout-text = []
render = []
